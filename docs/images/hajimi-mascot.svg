  <circle cx="44" cy="60.5" r="2.6" fill="#5CC4AE"/>
  <circle cx="71" cy="60.5" r="2.6" fill="#5CC4AE"/>
  <circle cx="50" cy="63" r="1.3" fill="#F6EBD4"/>
  <circle cx="77" cy="63" r="1.3" fill="#F6EBD4"/>
